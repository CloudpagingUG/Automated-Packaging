yamlConfigVersion: 3.2
PackagingNotes:
- ""

## Non Cloudpaging Studio settings ##
AppSettings:
  AppName: Ultimaker Cura
  ProductionSTPRepository: ReplaceMe # The full path to the production STPs folder
  InstallerDirectory: ReplaceMe # The full path to the folder containing production installers/packages
  PkgStagingDirectory: ReplaceMe # The full path to the folder where in-progress files will be stored
  STPBackupDirectory: ReplaceMe # The full path to the folder where completed STPs will be backed up
  AppAdminWebpage: ReplaceMe #The link to edit the application

PrefetchSettings:
  Manual: true # Needs to be prefetched on a physical system
  LaunchCommands:
  - 'PLAYER' # Cloudpaging Player Launch button
  Launches: 3
  RuntimeSeconds: 30
  VirtualizationSeconds: 10

RetentionSettings:
  STPCount: 2
  PackageCount: 3 
  IssueUnmodifiedDays: 30
## END Non Cloudpaging Studio settings ##

ProjectSettings:
  ProjectName: AP_Ultimaker-Cura_{0}_64bit_x64_NLR_EN_Rel1
  ProjectDescription: Ultimaker Cura is an open source slicing application for 3D printers. It was created by David Braam who was later employed by Ultimaker, a 3D printer manufacturing company, to maintain the software.
  IconFile: ""
  ProjectFileName: ""
  ProjectFolder: C:\Output
  TargetCommand:
    CommandLine: C:\Program Files\Ultimaker Cura {0}\UltiMaker-Cura.exe
    WorkingFolder: ""
  TargetOS:
  - ""

PreCaptureCommands:
- ""

CaptureSettings:
  CaptureTimeoutSec: 120
  CaptureAllProcesses: false
  IgnoreChangesUnderInstallerPath: true
  ReplaceRegistryShortPaths: true
  FileExclusions:
  - '%winDir%\Installer\*.msp'
  - '%winDir%\Installer\*.msi'
  - '%AppData%'
  RegistryExclusions:
  - HKEY_LOCAL_MACHINE\SYSTEM
  - HKEY_USERS\.DEFAULT
  - HKEY_CURRENT_USER\SOFTWARE
  ProcessExclusions:
  - C:\Windows\System32\svchost.exe
  ProcessInclusions:
    IncludeChildProccesses: false
    Include: []

