yamlConfigVersion: 3.1
PackagingNotes:
- ''

## Non Cloudpaging Studio settings ##
AppSettings:
  AppName: CONNECTION Client
  ProductionSTPRepository: ReplaceMe # The full path to the production STPs folder
  InstallerDirectory: ReplaceMe # The full path to the folder containing production installers/packages
  PkgStagingDirectory: ReplaceMe # The full path to the folder where in-progress files will be stored
  STPBackupDirectory: ReplaceMe # The full path to the folder where completed STPs will be backed up
  AppAdminWebpage: ReplaceMe #The link to edit the application

PrefetchSettings:
  LaunchCommands:
  - 'PLAYER' # Cloudpaging Player Launch button
  # - 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\<shortcut>.lnk' # Application Shortcut
  # - 'C:\Program Files\Path\to\<program>.exe' # Application executable
  Launches: 3
  RuntimeSeconds: 20
  VirtualizationSeconds: 15

RetentionSettings:
  STPCount: 2
  PackageCount: 3 
  IssueUnmodifiedDays: 30
## END Non Cloudpaging Studio settings ##

ProjectSettings:
  ProjectName: AP_Bentley_CONNECTION-Client_{0}_64bit_x64_NLR_EN_Rel1
  ProjectDescription: "The CONNECTION Client is your gateway to Bentley's cloud services, portals and analytics. By signing into the CONNECTION Client you can find your company's projects, track your time, explore analytics, download software updates, receive relevant notifications, and access other features available to you as a Bentley user. Signing into the CONNECTION Client is a prerequisite to participate in CONNECT capabilities provided through your Bentley desktop applications."
  IconFile: ""
  ProjectFileName: ""
  ProjectFolder: C:\Output
  TargetCommand:
    CommandLine: C:\Program Files\Common Files\Bentley Shared\CONNECTION Client\Bentley.Connect.Client.exe
    CommandLineFill: "" # If you want to override the default fill of the current version, you can put a command in here. See GIMP for an example
    WorkingFolder: ""
  TargetOS:
  - ""

PreCaptureCommands: []

CaptureSettings:
  CaptureTimeoutSec: 300 # Increase this value if capturing isn't fully completing
  CaptureAllProcesses: false
  IgnoreChangesUnderInstallerPath: true
  ReplaceRegistryShortPaths: true
  FileExclusions: # Add file paths here. Examples of wildcards and environment variables shown in sections here
  - '%userprofile%' # covers <userProfile>\<user>, <LocalAppData>, <RoamingAppData>
  - '%programdata%\Microsoft\EdgeUpdate' # Can't exclude all of ProgramData\Microsoft because start menu shortcuts live under that folder
  - '%programdata%\Microsoft\NetFramework' 
  - '%programdata%\Microsoft\Windows\wfp' # Can't exclude all of ProgramData\Microsoft\Windows for the same reason
  - '%programdata%\Microsoft\Windows Defender'
  - '%programdata%\Microsoft\Windows Security Health'
  - '%winDir%\Installer\*.msp'
  - '%winDir%\Installer\*.msi'
  - '%winDir%\Microsoft.NET'
  - '%winDir%\ServiceProfiles'
  - '%winDir%\SystemTemp'
  # - '%WinDir%' # covers <Windows>, <System>, and <SystemX86>
  RegistryExclusions: # Add registry paths to this location
  - HKEY_CURRENT_USER
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\SystemCertificates
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Wbem
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT
  - HKEY_LOCAL_MACHINE\SYSTEM
  - HKEY_USERS
  ProcessExclusions:
  - C:\Windows\System32\svchost.exe
  ProcessInclusions:
    IncludeChildProccesses: false
    Include: []

InstallerDownload:
  DownloadURL: ""
  DownloadPath: ""
  SHA-256: ""

CaptureCommands:
  Enabled: true
  PrerequisiteDownload: {}
  Prerequisites:
    Enabled: false
    Commands: []
  InstallerPrefix: ""
  InstallerPath: ""
  Installer: Deploy-Application.exe # start-package specific
  # InstallerFill: "" # functions the same as CommandLineFill - see GIMP for example
  InstallerCommands: -DeployMode Silent
  InstallerLogPath: 'C:\Windows\Logs\Software\*{0}*PSAppDeployToolkit*' # start-package specific
  InstallerProcess: '' # start-package specific
  PostInstallActions:
    Enabled: false
    Commands: []
  DebugMode: false

ModifyAssets:
  AddFiles: {}
  ModifyKeys: {}

VirtualizationSettings:
  DefaultDispositionLayer: 3
  DefaultServiceVirtualizationAction: Register
  FileDispositionLayers:
    AppData:
      Path: '%AppData%'
      Layer: 2
      Recurse: true
  RegistryDispositionLayers: {}
  SandboxFileExclusions: []
  SandboxRegistryExclusions: []

SecurityOverrideSettings:
  AllowAccessLayer4:
    AllowReadAndCopy: true
    Proccesses: []
  DenyAccessLayer3: []

OutputSettings:
  EncryptionMethod: AES-256-Enhanced
  CompressionMethod: LZMA
  OutputFileNameNoExt: ""
  FinalizeIntoSTP: false # {true | false} true if the app should NOT be prefetched and false if the app SHOULD be prefetched
  OutputFolder: C:\AP_Work