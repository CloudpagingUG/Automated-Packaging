yamlConfigVersion: 3.2
PackagingNotes:
- ''

## Non Cloudpaging Studio settings ##
AppSettings:
  AppName: Audacity 
  ProductionSTPRepository: ReplaceMe # The full path to the production STPs folder
  InstallerDirectory: ReplaceMe # The full path to the folder containing production installers/packages
  PkgStagingDirectory: ReplaceMe # The full path to the folder where in-progress files will be stored
  STPBackupDirectory: ReplaceMe # The full path to the folder where completed STPs will be backed up
  AppAdminWebpage: ReplaceMe #The link to edit the application

PrefetchSettings:
  LaunchCommands: 'PLAYER' # Cloudpaging Player Launch button
  Launches: 4
  RuntimeSeconds: 10
  VirtualizationSeconds: 5

RetentionSettings:
  STPCount: 2
  PackageCount: 3 
  IssueUnmodifiedDays: 30
## END Non Cloudpaging Studio settings ##

ProjectSettings:
  ProjectName: AP_Audacity_{0}_64bit_x64_NLR_EN_Rel1
  ProjectDescription: "Audacity is a free and open-source digital audio editor and recording application software, available for Windows, macOS/OS X and Unix-like operating systems. In addition to recording audio from multiple sources, Audacity can be used for post-processing of all types of audio, including podcasts by adding effects such as normalization, trimming, and fading in and out. Audacity has also been used to record and mix entire albums."
  IconFile: ""
  ProjectFileName: ""
  ProjectFolder: C:\Output
  TargetCommand:
    CommandLine: C:\Program Files\Audacity 4\bin\Audacity4.exe 
    WorkingFolder: ""
  TargetOS:
  - ""

PreCaptureCommands: []

CaptureSettings:
  CaptureTimeoutSec: 300
  CaptureAllProcesses: false
  IgnoreChangesUnderInstallerPath: true
  ReplaceRegistryShortPaths: true
  FileExclusions:
  - '%userprofile%' # covers <userProfile>\<user>, <LocalAppData>, <RoamingAppData>
  - '%programdata%\Microsoft\EdgeUpdate' # Can't exclude all of ProgramData\Microsoft because start menu shortcuts live under that folder
  - '%programdata%\Microsoft\NetFramework' 
  - '%programdata%\Microsoft\Windows\wfp' # Can't exclude all of ProgramData\Microsoft\Windows for the same reason
  - '%programdata%\Microsoft\Windows Defender'
  - '%programdata%\Microsoft\Windows Security Health'
  - '%programdata%\USOShared'
  - '%winDir%\Installer\*.msp'
  - '%winDir%\Installer\*.msi'
  - '%winDir%\Microsoft.NET'
  - '%winDir%\ServiceProfiles'
  - '%winDir%\SystemTemp'
  RegistryExclusions:
  - HKEY_CURRENT_USER
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Internet Explorer
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\EnterpriseCertificates
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\SystemCertificates
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Wbem
  - HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT
  - HKEY_LOCAL_MACHINE\SOFTWARE\Policies
  - HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer
  - HKEY_LOCAL_MACHINE\SYSTEM
  - HKEY_USERS
  ProcessExclusions:
  - C:\Windows\System32\svchost.exe
  ProcessInclusions:
    IncludeChildProccesses: false
    Include: []

## App Events section ##
PostCaptureSettings:
  ConfigurableAppEvents:
    AfterRegistration:
      Path: 'AppEvents\Audacity_After-Registration_AddFirewallRules.ps1'
      HandlerCommandLine:
        Parameters: ''
        UseLocalApplication: FALSE
      HandlerLaunching:
        RunElevated: FALSE
        RunAsLocalSystem: TRUE
      AfterLaunching:
        WaitForExit: TRUE
        Timeout: 1
        TimeoutUnit: 'MINUTES' # 'MINUTES' | 'SECONDS'
        SuccessCodes: '0'
