    BeforeDevirtualization:
      Path: 'AppEvents\Audacity_After-Registration_RemoveFirewallRules.ps1'
      Frequency: 'FirstTime' # 'FirstTime' | 'EveryTime'
      HandlerCommandLine:
        Parameters: ''
        UseLocalApplication: FALSE
      HandlerLaunching:
        RunVirtualized: FALSE
        RunElevated: FALSE     # Mutially exclusive with RunAsLocalSystem
        RunAsLocalSystem: TRUE # Mutially exclusive with RunElevated
      AfterLaunching:
        WaitForExit: TRUE
        Timeout: 1
        TimeoutUnit: 'MINUTES' # 'MINUTES' | 'SECONDS'
        SuccessCodes: '0'
