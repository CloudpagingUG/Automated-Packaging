InstallerDownload:
  DownloadURL: ""
  DownloadPath: ""
  SHA-256: ""

CaptureCommands:
  Enabled: true
  # PrerequisiteDownload: {}
  # Prerequisites:
  #   DispositionLayer: 4 
  #   Installer: Deploy-Application.exe
  #   InstallerArgs: -DeployMode Silent
  #   InstallerLogPath: 'C:\Windows\Logs\Software\*{0}*PSAppDeployToolkit*'
  #   InstallerProcess: ''
  #   Path: '\\multidrive.mtu.edu\multidrive\install\installers\Microsoft\Desktop Runtime\8\Windows\Standard'
  #   Version: latest # specific | latest
  InstallerPrefix: ""
  InstallerPath: ""
  Installer: VSCodeSetup-x64-{0}.exe # start-package specific
  # InstallerFill: "" # functions the same as CommandLineFill - see GIMP for example
  InstallerCommands: /VERYSILENT /MERGETASKS="addcontextmenufiles,addcontextmenufolders,addtopath,!runcode,!desktopicon,"
  InstallerLogPath: '' # start-package specific
  InstallerProcess: '' # start-package specific
  PostInstallActions:
    Enabled: true
    Commands: ["powershell.exe -Command \"& {[System.Environment]::SetEnvironmentVariable('VSCODE_EXTENSIONS', '%%appdata%%\\Code\\Extensions', 'Machine')}\""]
  DebugMode: false

ModifyAssets:
  AddFiles: {}
  ModifyKeys: {}

VirtualizationSettings:
  DefaultDispositionLayer: 3
  DefaultServiceVirtualizationAction: Register
  FileDispositionLayers: {}
  RegistryDispositionLayers: {}
  SandboxFileExclusions: []
  SandboxRegistryExclusions: []

SecurityOverrideSettings:
  AllowAccessLayer4:
    AllowReadAndCopy: true
    Proccesses: []
  DenyAccessLayer3: []

OutputSettings:
  EncryptionMethod: AES-256-Enhanced
  CompressionMethod: LZMA
  OutputFileNameNoExt: ""
  FinalizeIntoSTP: false
  OutputFolder: C:\AP_Work
